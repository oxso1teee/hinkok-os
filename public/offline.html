<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Нет соединения | HinkoK OS</title>
<style>
  html { background: #0d0705; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: linear-gradient(180deg, #1b0b06 0%, #160a06 45%, #100806 100%);
    color: #f4e3d3;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    max-width: 360px;
    padding: 28px 26px;
    border: 1px solid rgb(166 76 35 / 28%);
    border-radius: 9px;
    background: rgb(45 18 10 / 76%);
    text-align: center;
  }
  .mark {
    display: inline-grid;
    width: 42px;
    height: 42px;
    margin-bottom: 18px;
    place-items: center;
    border: 1px solid rgb(223 104 45 / 48%);
    border-radius: 7px;
    background: rgb(239 121 47 / 14%);
    color: #ff9b50;
    font-size: 19px;
    font-weight: 750;
  }
  h1 { margin: 0 0 8px; font-size: 17px; }
  p { margin: 0; color: #d2a98b; font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">H</div>
    <h1>Нет соединения</h1>
    <p>HinkoK OS не может связаться с сервером. Проверьте интернет и попробуйте ещё раз — локальные данные не показываются офлайн, чтобы не вводить в заблуждение устаревшими цифрами.</p>
  </div>
</body>
</html>
